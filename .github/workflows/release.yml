name: Package release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify-native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run check
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run release:verify -- --out .direct-ota/release-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: direct-ota-release
          path: .direct-ota/release-artifacts/*
          if-no-files-found: error
          retention-days: 7
  github-release:
    needs: [verify-native, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: direct-ota-release
          path: release-artifacts
      - name: Publish verified package and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-artifacts/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
  npm-release:
    if: vars.DIRECT_OTA_NPM_PUBLISH == 'true'
    needs: [github-release]
    runs-on: ubuntu-latest
    environment: npm-publication
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: direct-ota-release
          path: release-artifacts
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish the exact verified tarball
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN"
          npm publish release-artifacts/*.tgz --access public
